<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艺术画廊 - Style-16</title>
    <style>
        :root {
            color-scheme: dark;
            --gold-1: #d4af37;
            --gold-2: #f5d76e;
            --ink-1: #0a1220;
            --ink-2: #111f33;
            --ink-3: #1a2d48;
            --card-bg: rgba(11, 20, 34, 0.78);
            --card-border: rgba(212, 175, 55, 0.28);
            --muted: #97a4b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
            color: #edf2fa;
            background:
                radial-gradient(circle at 14% 20%, rgba(212, 175, 55, 0.12), rgba(212, 175, 55, 0) 32%),
                radial-gradient(circle at 86% 82%, rgba(88, 130, 190, 0.14), rgba(88, 130, 190, 0) 38%),
                linear-gradient(130deg, var(--ink-1), var(--ink-2) 44%, var(--ink-3));
            overflow-x: hidden;
        }

        .spotlight-cursor {
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 72%);
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .gallery-shell {
            width: min(96vw, 2400px);
            margin: 0 auto;
            padding: clamp(26px, 2.5vw, 52px) clamp(14px, 1.8vw, 36px) clamp(32px, 3.2vw, 64px);
        }

        .gallery-head {
            display: grid;
            gap: 14px;
            margin-bottom: clamp(26px, 2.4vw, 44px);
        }

        .gallery-title {
            font-size: clamp(2rem, 2.4vw, 3.8rem);
            letter-spacing: 0.13em;
            color: transparent;
            background: linear-gradient(120deg, var(--gold-1), var(--gold-2), var(--gold-1));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 24px rgba(212, 175, 55, 0.22);
        }

        .gallery-subtitle {
            font-size: clamp(0.95rem, 1vw, 1.35rem);
            color: rgba(237, 242, 250, 0.76);
            letter-spacing: 0.06em;
        }

        .gallery-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .toolbar-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(5, 10, 18, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(237, 242, 250, 0.92);
            font-size: clamp(0.82rem, 0.84vw, 1.02rem);
            letter-spacing: 0.04em;
        }

        .toolbar-chip strong {
            color: var(--gold-2);
            font-weight: 600;
        }

        .toolbar-btn {
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 999px;
            background: rgba(14, 25, 40, 0.86);
            color: #f5edca;
            padding: 8px 14px;
            font-size: clamp(0.8rem, 0.82vw, 0.98rem);
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.25s ease;
        }

        .toolbar-btn:hover {
            transform: translateY(-1px);
            background: rgba(25, 41, 63, 0.95);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: clamp(14px, 1.3vw, 26px);
        }

        @media (min-width: 960px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1420px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (min-width: 2100px) {
            .gallery-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (min-width: 3200px) {
            .gallery-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }

        .artwork {
            position: relative;
            border-radius: 12px;
            background: var(--card-bg);
            border: none;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .artwork:hover,
        .artwork.is-focus {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 28px rgba(212, 175, 55, 0.16);
        }

        .artwork-image-container {
            position: relative;
            margin: 12px 12px 0;
            aspect-ratio: 4 / 3;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(8, 15, 24, 0.92);
            --photo-bg: none;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        @media (min-width: 2100px) {
            .artwork-image-container {
                aspect-ratio: 16 / 10;
            }
        }

        @media (min-width: 3200px) {
            .artwork-image-container {
                aspect-ratio: 5 / 3;
            }
        }

        .artwork-image-container::before {
            content: "";
            position: absolute;
            inset: -8%;
            background-image: var(--photo-bg);
            background-size: cover;
            background-position: center;
            filter: blur(28px) saturate(0.9) brightness(0.82);
            transform: scale(1.1);
            opacity: 0.72;
        }

        .artwork img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.8s ease;
        }

        body[data-photo-fit="cover"] .artwork img {
            object-fit: cover;
        }

        .artwork:hover img {
            transform: scale(1.04);
        }

        .artwork-spotlight {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.17) 0%, rgba(255, 255, 255, 0) 54%);
        }

        .artwork-info {
            padding: 14px 16px 16px;
            background: linear-gradient(to bottom, rgba(12, 22, 35, 0.86), rgba(8, 15, 24, 0.96));
            display: grid;
            gap: 9px;
        }

        .artwork-title {
            color: #f6dc89;
            font-size: clamp(1rem, 1.08vw, 1.45rem);
            line-height: 1.25;
            letter-spacing: 0.04em;
            word-break: break-word;
        }

        .artwork-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: clamp(0.75rem, 0.8vw, 0.97rem);
            color: var(--muted);
        }

        .artwork-artist,
        .artwork-year {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .artwork-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            border-radius: 999px;
            border: 1px solid rgba(130, 154, 188, 0.44);
            background: rgba(19, 33, 52, 0.92);
            color: #ced8e7;
            font-size: clamp(0.7rem, 0.74vw, 0.86rem);
            padding: 3px 9px;
            letter-spacing: 0.02em;
        }

        .tag.muted {
            border-color: rgba(151, 164, 184, 0.35);
            color: rgba(173, 186, 206, 0.75);
        }

        .artwork-description {
            color: rgba(220, 230, 243, 0.84);
            font-size: clamp(0.82rem, 0.83vw, 1rem);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            max-height: 3em;
            transition: max-height 0.35s ease;
        }

        .artwork:hover .artwork-description,
        .artwork.is-focus .artwork-description {
            -webkit-line-clamp: 5;
            max-height: 7.5em;
        }

        .load-more-container {
            display: flex;
            justify-content: center;
            margin-top: clamp(24px, 2.5vw, 48px);
        }

        .load-more-btn {
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 999px;
            background: rgba(15, 27, 42, 0.92);
            color: #f5edca;
            padding: 12px 24px;
            font-size: clamp(0.88rem, 0.88vw, 1.02rem);
            letter-spacing: 0.07em;
            cursor: pointer;
            transition: background 0.28s ease, transform 0.2s ease, opacity 0.2s ease;
        }

        .load-more-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            background: rgba(31, 47, 67, 0.98);
        }

        .load-more-btn:disabled {
            cursor: not-allowed;
            opacity: 0.46;
        }

        .empty-state {
            margin: clamp(36px, 3vw, 72px) auto 0;
            width: min(560px, 100%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(12, 20, 34, 0.72);
            padding: 24px;
            text-align: center;
            color: rgba(223, 232, 245, 0.82);
            display: none;
            line-height: 1.7;
        }

        body.reduce-motion .spotlight-cursor,
        body.reduce-motion .artwork-spotlight {
            display: none;
        }

        body.reduce-motion .artwork,
        body.reduce-motion .artwork img,
        body.reduce-motion .artwork-description {
            transition: none;
        }

        @media (max-width: 780px) {
            .gallery-toolbar {
                gap: 8px;
            }

            .toolbar-chip,
            .toolbar-btn,
            .load-more-btn {
                width: 100%;
                justify-content: center;
                text-align: center;
            }

            .artwork-meta {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body data-photo-fit="contain">
    <div class="spotlight-cursor"></div>

    <main class="gallery-shell">
        <header class="gallery-head">
            <h1 class="gallery-title">光影典藏馆</h1>
            <p class="gallery-subtitle">以真实照片元数据生成展签，更适合大屏持续展陈</p>
            <div class="gallery-toolbar">
                <span class="toolbar-chip"><strong id="photoCount">0 / 0</strong> 已展出</span>
                <button class="toolbar-btn" id="fitToggleBtn" type="button">画面模式：完整显示</button>
                <button class="toolbar-btn" id="autoToggleBtn" type="button">自动扩展：开启</button>
            </div>
        </header>

        <section class="gallery-grid" id="gallery" aria-live="polite"></section>
        <div class="empty-state" id="emptyState">还没有可展示的照片。请先上传一些图片，然后刷新页面查看展陈效果。</div>

        <div class="load-more-container">
            <button class="load-more-btn" id="loadMoreBtn" type="button">加载更多作品</button>
        </div>
    </main>

    <template id="artworkTemplate">
        <article class="artwork">
            <div class="artwork-image-container">
                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="照片" loading="lazy" decoding="async">
                <div class="artwork-spotlight"></div>
            </div>
            <div class="artwork-info">
                <h3 class="artwork-title"></h3>
                <div class="artwork-meta">
                    <span class="artwork-artist"></span>
                    <span class="artwork-year"></span>
                </div>
                <div class="artwork-tags"></div>
                <div class="artwork-description"></div>
            </div>
        </article>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const gallery = document.getElementById('gallery');
            const template = document.getElementById('artworkTemplate');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const fitToggleBtn = document.getElementById('fitToggleBtn');
            const autoToggleBtn = document.getElementById('autoToggleBtn');
            const photoCount = document.getElementById('photoCount');
            const emptyState = document.getElementById('emptyState');
            const spotlightCursor = document.querySelector('.spotlight-cursor');

            const supportsHover = window.matchMedia('(hover: hover)').matches;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const motionEnabled = supportsHover && !prefersReducedMotion;
            if (!motionEnabled) {
                document.body.classList.add('reduce-motion');
            }

            const fallbackNarratives = [
                '光与影在这一刻交织，留下了时间最温柔的纹理。',
                '细节被安静收藏，远看是风景，近看是当下。',
                '这一帧记录了情绪与空间的呼吸，适合慢慢观看。',
                '画面中的留白让故事继续生长，像一段未写完的诗。',
                '镜头把日常抬升为展品，平凡因此有了仪式感。'
            ];

            let photos = [];
            let renderedCount = 0;
            let fitMode = 'contain';
            let autoExpandEnabled = true;
            let autoExpandTimer = null;
            let autoFocusTimer = null;
            let focusedCardIndex = -1;

            function getBatchSize() {
                const w = window.innerWidth;
                if (w >= 3200) return 18;
                if (w >= 2400) return 14;
                if (w >= 1500) return 10;
                return 8;
            }

            function parseTags(raw) {
                if (!raw) return [];
                return String(raw)
                    .split(/[,\uFF0C\u3001;|\s]+/)
                    .map(function (tag) { return tag.trim(); })
                    .filter(Boolean);
            }

            function formatDate(rawDate) {
                if (!rawDate) return '拍摄日期未设置';
                const match = String(rawDate).match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (!match) return String(rawDate);
                return match[1] + '年' + Number(match[2]) + '月' + Number(match[3]) + '日';
            }

            function extractNameFromUrl(url) {
                if (!url) return '';
                try {
                    const decoded = decodeURIComponent(String(url));
                    const name = decoded.split('/').pop() || decoded;
                    return name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
                } catch (_) {
                    return String(url).split('/').pop().replace(/\.[^.]+$/, '');
                }
            }

            function buildTitle(photo, index) {
                const noteTitle = String(photo.note_title || '').trim();
                if (noteTitle) return noteTitle;

                const tags = parseTags(photo.tags);
                if (tags.length > 0) {
                    return tags.slice(0, 3).join(' · ');
                }

                return '未分类影像 ' + String(index + 1).padStart(2, '0');
            }

            function buildYear(photo) {
                if (photo.date) {
                    const yearMatch = String(photo.date).match(/^(\d{4})/);
                    if (yearMatch) return yearMatch[1] + '年拍摄';
                    return String(photo.date);
                }
                return '日期待补充';
            }

            function buildDescription(photo, index) {
                const noteBody = String(photo.note_body || '').trim();
                if (noteBody) return noteBody;

                return fallbackNarratives[index % fallbackNarratives.length];
            }

            function setCardSpotlight(card) {
                if (!motionEnabled) return;
                card.addEventListener('mousemove', function (event) {
                    const rect = card.getBoundingClientRect();
                    const mouseX = ((event.clientX - rect.left) / rect.width) * 100;
                    const mouseY = ((event.clientY - rect.top) / rect.height) * 100;
                    card.style.setProperty('--mouse-x', mouseX + '%');
                    card.style.setProperty('--mouse-y', mouseY + '%');
                });
            }

            function createTag(tagText, muted) {
                const span = document.createElement('span');
                span.className = muted ? 'tag muted' : 'tag';
                span.textContent = tagText;
                return span;
            }

            function createArtworkCard(photo, index) {
                const card = template.content.firstElementChild.cloneNode(true);
                const imageWrap = card.querySelector('.artwork-image-container');
                const image = card.querySelector('img');
                const titleEl = card.querySelector('.artwork-title');
                const artistEl = card.querySelector('.artwork-artist');
                const yearEl = card.querySelector('.artwork-year');
                const tagsEl = card.querySelector('.artwork-tags');
                const descEl = card.querySelector('.artwork-description');

                const safeUrl = String(photo.url || '').trim();
                const photoSrc = '/static/photos/' + encodeURI(safeUrl);
                const title = buildTitle(photo, index);
                const tags = parseTags(photo.tags);

                image.src = photoSrc;
                image.alt = title;
                image.loading = index < getBatchSize() ? 'eager' : 'lazy';
                imageWrap.style.setProperty('--photo-bg', 'url("' + photoSrc.replace(/"/g, '%22') + '")');

                titleEl.textContent = title;
                artistEl.textContent = '私人收藏';
                yearEl.textContent = buildYear(photo);
                descEl.textContent = buildDescription(photo, index);

                if (tags.length > 0) {
                    tags.slice(0, 4).forEach(function (tag) {
                        tagsEl.appendChild(createTag(tag, false));
                    });
                } else {
                    tagsEl.appendChild(createTag('未分类', true));
                }

                image.dataset.fullDate = formatDate(photo.date);
                image.title = title + '\n' + image.dataset.fullDate;
                setCardSpotlight(card);
                return card;
            }

            function refreshPhotoCounter() {
                photoCount.textContent = renderedCount + ' / ' + photos.length;
            }

            function refreshLoadMoreButton() {
                if (renderedCount >= photos.length) {
                    loadMoreBtn.disabled = true;
                    loadMoreBtn.textContent = '已显示全部作品';
                    return;
                }
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = '加载更多作品';
            }

            function renderBatch(batchSize) {
                const remaining = photos.length - renderedCount;
                const take = Math.min(batchSize, remaining);
                if (take <= 0) return 0;

                const fragment = document.createDocumentFragment();
                for (let i = 0; i < take; i += 1) {
                    const photo = photos[renderedCount + i];
                    fragment.appendChild(createArtworkCard(photo, renderedCount + i));
                }
                gallery.appendChild(fragment);
                renderedCount += take;
                refreshPhotoCounter();
                refreshLoadMoreButton();
                return take;
            }

            function updateFitModeButton() {
                fitToggleBtn.textContent = fitMode === 'contain' ? '画面模式：完整显示' : '画面模式：填充画幅';
            }

            function setFitMode(nextMode) {
                fitMode = nextMode;
                document.body.setAttribute('data-photo-fit', fitMode);
                updateFitModeButton();
            }

            function stopAutoExpand() {
                if (autoExpandTimer) {
                    clearInterval(autoExpandTimer);
                    autoExpandTimer = null;
                }
            }

            function startAutoExpand() {
                stopAutoExpand();
                if (!autoExpandEnabled) return;
                autoExpandTimer = setInterval(function () {
                    if (renderedCount < photos.length) {
                        renderBatch(Math.max(2, Math.floor(getBatchSize() / 2)));
                    } else {
                        stopAutoExpand();
                    }
                }, 12000);
            }

            function updateAutoToggleButton() {
                autoToggleBtn.textContent = autoExpandEnabled ? '自动扩展：开启' : '自动扩展：关闭';
            }

            function stopAutoFocus() {
                if (autoFocusTimer) {
                    clearInterval(autoFocusTimer);
                    autoFocusTimer = null;
                }
            }

            function startAutoFocus() {
                stopAutoFocus();
                if (!motionEnabled) return;
                autoFocusTimer = setInterval(function () {
                    const cards = gallery.querySelectorAll('.artwork');
                    if (cards.length === 0) return;

                    if (focusedCardIndex >= 0 && focusedCardIndex < cards.length) {
                        cards[focusedCardIndex].classList.remove('is-focus');
                    }
                    focusedCardIndex = (focusedCardIndex + 1) % cards.length;
                    cards[focusedCardIndex].classList.add('is-focus');
                }, 6800);
            }

            function initGlobalCursor() {
                if (!motionEnabled || !spotlightCursor) return;

                document.addEventListener('mousemove', function (event) {
                    spotlightCursor.style.left = event.clientX + 'px';
                    spotlightCursor.style.top = event.clientY + 'px';
                });

                document.addEventListener('mouseenter', function () {
                    spotlightCursor.style.opacity = '1';
                });
                document.addEventListener('mouseleave', function () {
                    spotlightCursor.style.opacity = '0';
                });
            }

            function renderInitialGallery(list) {
                photos = Array.isArray(list) ? list.filter(function (item) {
                    return item && item.url;
                }) : [];

                if (photos.length === 0) {
                    emptyState.style.display = 'block';
                    loadMoreBtn.disabled = true;
                    loadMoreBtn.textContent = '暂无作品';
                    refreshPhotoCounter();
                    return;
                }

                emptyState.style.display = 'none';
                renderBatch(getBatchSize() * 2);
                startAutoExpand();
                startAutoFocus();
            }

            loadMoreBtn.addEventListener('click', function () {
                renderBatch(getBatchSize());
                if (autoExpandEnabled && renderedCount >= photos.length) {
                    stopAutoExpand();
                }
            });

            fitToggleBtn.addEventListener('click', function () {
                const next = fitMode === 'contain' ? 'cover' : 'contain';
                setFitMode(next);
            });

            autoToggleBtn.addEventListener('click', function () {
                autoExpandEnabled = !autoExpandEnabled;
                updateAutoToggleButton();
                if (autoExpandEnabled) {
                    startAutoExpand();
                } else {
                    stopAutoExpand();
                }
            });

            window.addEventListener('resize', function () {
                if (autoExpandEnabled) {
                    startAutoExpand();
                }
            });

            setFitMode('contain');
            updateAutoToggleButton();
            initGlobalCursor();

            fetch('/api/images', { credentials: 'same-origin' })
                .then(function (response) {
                    return response.ok ? response.json() : [];
                })
                .then(function (list) {
                    renderInitialGallery(list);
                })
                .catch(function () {
                    renderInitialGallery([]);
                });
        });
    </script>
    <script src="{{ url_for('static', filename='unified-style-menu.js') }}?v=2"></script>
</body>
</html>
