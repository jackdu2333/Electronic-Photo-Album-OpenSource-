<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>家庭录像带 - VHS Camcorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           style20 · 家庭录像带 VHS Camcorder
           设计哲学：把每张家庭照片放回 90 年代摄像机的取景器——
           REC 红点、走带时间码、真实拍摄日期戳、换带时的磁带抖动。
           OSD 只占左上 / 顶中 / 左下 / 底中，右上右下留给统一菜单与翻页导航。
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --osd-white: rgba(255, 255, 255, 0.94);
            --osd-amber: #ffcf5c;
            --rec-red: #ff3b30;
            --osd-shadow: 0 0 4px rgba(0, 0, 0, 0.65), 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            color: var(--osd-white);
        }

        /* ---------- 取景器：全出血照片 ---------- */
        .viewfinder {
            position: fixed;
            inset: 0;
            background: #000;
        }

        .viewfinder img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .viewfinder img.loaded {
            opacity: 1;
        }

        /* 换带抖动：一次 260ms 的磁带拉扯感 */
        .viewfinder.jitter img {
            animation: vhsJitter 0.26s steps(3) 1;
        }

        @keyframes vhsJitter {
            0% { transform: translateX(0); filter: brightness(1.6) saturate(0.3); }
            33% { transform: translateX(-6px) skewX(0.6deg); filter: brightness(0.8); }
            66% { transform: translateX(5px); filter: brightness(1.3) saturate(0.5); }
            100% { transform: translateX(0); filter: brightness(1); }
        }

        /* ---------- CRT 质感层：扫描线 + 暗角 ---------- */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                rgba(255, 255, 255, 0.028) 0 1px,
                transparent 1px 3px);
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                transparent 52%,
                rgba(0, 0, 0, 0.28) 78%,
                rgba(0, 0, 0, 0.55) 100%);
        }

        /* 磁带噪点带：换带时闪现 */
        .tracking {
            position: fixed;
            left: 0;
            right: 0;
            height: 26px;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: repeating-linear-gradient(0deg,
                rgba(255, 255, 255, 0.16) 0 2px,
                rgba(0, 0, 0, 0.3) 2px 4px,
                transparent 4px 7px);
        }

        .tracking.t1 { top: 18%; }
        .tracking.t2 { top: 64%; height: 14px; }

        /* ---------- OSD 层 ---------- */
        .osd {
            position: fixed;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'VT323', 'Space Mono', monospace;
            font-size: 24px;
            line-height: 1;
            letter-spacing: 0.06em;
            color: var(--osd-white);
            text-shadow: var(--osd-shadow);
            pointer-events: none;
        }

        .osd-tl { top: calc(20px + var(--safe-top, 0px)); left: 24px; }
        .osd-tc { top: calc(22px + var(--safe-top, 0px)); left: 50%; transform: translateX(-50%); font-size: 20px; }
        .osd-bl { bottom: calc(20px + var(--safe-bottom, 0px)); left: 24px; }
        .osd-bc {
            bottom: calc(20px + var(--safe-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            flex-direction: column;
            gap: 6px;
            text-align: center;
            max-width: min(72vw, 560px);
        }

        .rec-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--rec-red);
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.7);
            animation: recBlink 1.2s steps(1) infinite;
        }

        @keyframes recBlink {
            0%, 55% { opacity: 1; }
            56%, 100% { opacity: 0.12; }
        }

        /* 日期戳：琥珀色，经典摄像机日期印 */
        .tape-date {
            color: var(--osd-amber);
            font-size: 26px;
        }

        .memo-line {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 13px;
            letter-spacing: 0.08em;
            opacity: 0.85;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
            transition: opacity 0.4s ease;
        }

        .memo-line:empty {
            display: none;
        }

        /* 电量计（纯 CSS，non-svg 备用方案已弃用） */
        .battery {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 2px;
            border: 1.5px solid var(--osd-white);
            border-radius: 2px;
            position: relative;
        }

        .battery::after {
            content: "";
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2.5px;
            height: 7px;
            background: var(--osd-white);
        }

        .battery i {
            width: 5px;
            height: 10px;
            background: var(--osd-white);
            opacity: 0.92;
        }

        .battery i.dead {
            opacity: 0.22;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 640px) {
            .osd { font-size: 19px; }
            .osd-tc { display: none; }
            .tape-date { font-size: 20px; }
            .osd-tl { left: 16px; }
            .osd-bl { left: 16px; }
            /* 375px 下右下角是 usm 翻页导航，底中字幕抬高避让 */
            .osd-bc { max-width: 86vw; bottom: calc(84px + var(--safe-bottom, 0px)); }
        }

        /* ---------- 无障碍基线：键盘焦点 + 动效减弱 ---------- */
        :focus-visible {
            outline: 2px solid #007AFF;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            /* REC 红点在减弱动效下保持常亮 */
            .rec-dot {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- 取景器 -->
    <div class="viewfinder" id="viewfinder">
        <img id="main-img" alt="家庭照片">
    </div>

    <!-- CRT 质感层 -->
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="tracking t1" aria-hidden="true"></div>
    <div class="tracking t2" aria-hidden="true"></div>

    <!-- OSD：左上 REC + 走带计数 -->
    <div class="osd osd-tl" aria-hidden="true">
        <span class="rec-dot"></span>
        <span>REC</span>
        <span id="rec-counter">00:00:00</span>
    </div>

    <!-- OSD：顶中 SP + 电量 -->
    <div class="osd osd-tc" aria-hidden="true">
        <span>SP</span>
        <span class="battery" data-battery><i></i><i></i><i class="dead"></i></span>
    </div>

    <!-- OSD：左下 当前时间（摄像机日期印位） -->
    <div class="osd osd-bl" aria-hidden="true">
        <span id="clock-time">--:--</span>
    </div>

    <!-- OSD：底中 磁带日期（真实拍摄日期）+ 留言字幕 -->
    <div class="osd osd-bc">
        <span class="tape-date" id="tape-date">PLAY ▸ ----</span>
        <span class="memo-line" id="memo-line"></span>
    </div>

    <script src="/static/unified-style-menu.js"></script>
    <script>
        (function () {
            'use strict';

            const viewfinder = document.getElementById('viewfinder');
            const mainImg = document.getElementById('main-img');
            const tapeDateEl = document.getElementById('tape-date');
            const memoLine = document.getElementById('memo-line');
            const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

            let photos = [];
            let currentIndex = 0;
            let photoFailStreak = 0; // 连续加载失败熔断，避免全部失败时无限跳片
            let jitterTimer = null;

            function pad(n) { return String(n).padStart(2, '0'); }

            /* ---------- 时钟与 REC 走带计数 ---------- */
            function tickClock() {
                const now = new Date();
                document.getElementById('clock-time').textContent =
                    pad(now.getHours()) + ':' + pad(now.getMinutes());
            }

            const recStart = Date.now();
            function tickCounter() {
                const s = Math.floor((Date.now() - recStart) / 1000);
                document.getElementById('rec-counter').textContent =
                    pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
            }

            /* ---------- 磁带日期：真实拍摄日期优先，缺省回落当前 ---------- */
            function formatTapeDate(dateStr) {
                const m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(dateStr || ''));
                if (m) {
                    return MONTHS[Number(m[2]) - 1] + ' ' + pad(Number(m[3])) + ' ' + m[1];
                }
                const now = new Date();
                return MONTHS[now.getMonth()] + ' ' + pad(now.getDate()) + ' ' + now.getFullYear();
            }

            function showTapeDate(photo) {
                tapeDateEl.textContent = 'PLAY ▸ ' + formatTapeDate(photo && photo.date);
            }

            /* ---------- 换带抖动 ---------- */
            function playJitter() {
                viewfinder.classList.add('jitter');
                document.querySelectorAll('.tracking').forEach(t => t.style.opacity = '1');
                clearTimeout(jitterTimer);
                jitterTimer = setTimeout(() => {
                    viewfinder.classList.remove('jitter');
                    document.querySelectorAll('.tracking').forEach(t => t.style.opacity = '0');
                }, 280);
            }

            /* ---------- 照片轮播 ---------- */
            function showPhoto(index) {
                if (!photos.length) return;
                currentIndex = (index + photos.length) % photos.length;
                const p = photos[currentIndex];
                const url = p.display_url || '/api/photos/' + p.id + '/image';
                // 终帧/失败态：失败自动跳下一张，连续失败超过相册数量则停下
                mainImg.onload = function () { photoFailStreak = 0; };
                mainImg.onerror = function () {
                    mainImg.onerror = null;
                    photoFailStreak += 1;
                    if (photoFailStreak < photos.length) {
                        showPhoto(currentIndex + 1);
                    }
                };
                mainImg.classList.remove('loaded');
                mainImg.src = url;
                // 等照片真正可显示再淡入，避免半载黑屏
                mainImg.addEventListener('load', function onLoaded() {
                    mainImg.removeEventListener('load', onLoaded);
                    mainImg.classList.add('loaded');
                });
                showTapeDate(p);
                playJitter();
            }

            function nextImage() { showPhoto(currentIndex + 1); }
            function prevImage() { showPhoto(currentIndex - 1); }
            window.nextImage = nextImage;
            window.prevImage = prevImage;

            async function fetchPhotos() {
                try {
                    const res = await fetch('/api/photos', { credentials: 'same-origin' });
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        photos = data;
                        showPhoto(0);
                        setInterval(() => showPhoto(currentIndex + 1), 8000);
                    }
                } catch (e) { console.error(e); }
            }

            /* ---------- 留言字幕（复用 /api/messages，60s 轮询） ---------- */
            function clip(text, n) {
                text = String(text || '');
                return text.length > n ? text.slice(0, n) + '…' : text;
            }

            async function fetchLatestMessage() {
                try {
                    const res = await fetch('/api/messages?limit=10', { credentials: 'same-origin' });
                    if (!res.ok) return;
                    const list = await res.json();
                    if (!Array.isArray(list) || list.length === 0) return;
                    const latest = list[list.length - 1];
                    memoLine.textContent = latest && latest.content ? 'MEMO ▸ ' + clip(latest.content, 42) : '';
                } catch (_) { /* 静默：字幕缺失不影响取景器 */ }
            }

            /* ---------- 启动 ---------- */
            document.addEventListener('DOMContentLoaded', function () {
                tickClock();
                tickCounter();
                setInterval(tickClock, 1000);
                setInterval(tickCounter, 1000);
                fetchPhotos();
                fetchLatestMessage();
                setInterval(fetchLatestMessage, 60000);
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        tickClock();
                        fetchLatestMessage();
                    }
                });
            });
        })();
    </script>
</body>

</html>
