<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>相框管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="admin-body">

    <!-- iOS-style Navigation Bar -->
    <header class="ios-nav-bar">
        <div class="ios-nav-inner">
            <a href="{{ url_for('main.index') }}" class="ios-nav-back" target="_blank" rel="noopener noreferrer">
                <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
                    <path d="M8.5 1L1.5 8L8.5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                相框
            </a>
            <h1 class="ios-nav-title">管理后台</h1>
            <div class="ios-nav-actions">
                <a href="{{ url_for('main.manage_page') }}" class="ios-nav-action">整理</a>
                <a href="{{ url_for('main.logout') }}" class="ios-nav-action">退出</a>
            </div>
        </div>
    </header>

    <main class="admin-main-ios">

        <!-- v3.0: 本地相册文件夹管理 -->
        <section class="ios-section">
            <div class="ios-section-header">
                <span class="ios-section-label">本地相册文件夹</span>
                <div style="display:flex;gap:8px;">
                    <button id="add-folder-btn" class="ios-link-btn" onclick="addFolder()">添加文件夹</button>
                    <button id="rescan-btn" class="ios-link-btn" onclick="rescanSources()">重新扫描</button>
                </div>
            </div>
            <div class="ios-card" style="padding: 16px;">
                <div id="folder-list" style="margin-bottom: 12px;">
                    <div class="admin-muted">加载中...</div>
                </div>
                <div id="scan-status" class="admin-hint" style="display: none;"></div>
                <p class="admin-hint">
                    引用本地文件夹中的照片，原图不会被复制或修改。<br>
                    桌面客户端可通过系统托盘选择文件夹，也可在此处管理。
                </p>
            </div>
        </section>

        <!-- Upload Card (v3.0: 改为“导入副本”) -->
        <section class="ios-section">
            <div class="ios-section-header">
                <span class="ios-section-label">导入照片副本</span>
            </div>
            <div class="ios-card upload-card-ios">
                <label id="drop-zone" for="file-input" class="drop-zone-ios">
                    <div class="drop-zone-prompt">
                        <div class="upload-icon-circle">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </div>
                        <p class="drop-zone-title">点击或拖拽导入</p>
                        <p class="drop-zone-sub">导入副本：照片会被复制到服务器存储</p>
                    </div>
                    <input type="file" id="file-input" name="files" multiple accept="image/*" class="file-input-hidden">
                </label>

                <!-- Preview Grid (hidden initially) -->
                <div id="upload-preview-area" class="preview-area hidden">
                    <div class="preview-header-ios">
                        <span id="selected-count" class="selected-count-label">已选择 0 个文件</span>
                        <button id="clear-selection-btn" class="ios-link-btn danger">清空</button>
                    </div>
                    <div id="preview-grid" class="preview-grid-ios"></div>
                    <div class="upload-actions-ios">
                        <button id="upload-btn" class="ios-btn ios-btn-primary ios-btn-full">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="20" />
                            </svg>
                            开始上传
                        </button>
                        <button id="upload-force-btn" class="ios-btn ios-btn-warning ios-btn-full">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <polyline points="12 6 12 12 16 14" />
                            </svg>
                            上传并立即展示 (10分钟)
                        </button>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div id="progress-container" class="progress-container-ios hidden">
                    <div class="progress-track-ios">
                        <div id="progress-bar" class="progress-fill-ios"></div>
                    </div>
                    <span id="progress-text" class="progress-text-ios">准备上传...</span>
                </div>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="ios-section">
            <div class="ios-section-header">
                <span class="ios-section-label">相册</span>
                <span id="gallery-count" class="admin-count"></span>
                <button id="refresh-gallery-btn" class="ios-link-btn">刷新</button>
            </div>
            <div class="ios-card gallery-outer-card">
                <div id="gallery-grid" class="gallery-grid-ios">
                    <div class="loading-spinner">正在加载...</div>
                </div>
            </div>
        </section>

    </main>

    <div id="toast-container"></div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
    // ── v3.0: 本地文件夹管理 ──────────────────────────
    (function() {
        const folderList = document.getElementById('folder-list');
        const scanStatus = document.getElementById('scan-status');
        const galleryCount = document.getElementById('gallery-count');

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 属性上下文转义（P0-1：文本转义不覆盖引号，属性值必须单独转义）
        function escapeAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const FOLDER_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>';
        const PACKAGE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';

        async function loadSources() {
            try {
                const res = await fetch('/api/photo-sources');
                const data = await res.json();

                // 渲染文件夹列表（P0-1：弃用内联 onclick 字符串拼接，改 data-* + 事件委托）
                let html = '';
                for (const src of data.sources) {
                    if (src.type === 'desktop_folder' && src.folders) {
                        for (const f of src.folders) {
                            const safeF = escapeHtml(f);
                            const attrF = escapeAttr(f);
                            const statusCls = src.authorized ? 'folder-status ok' : 'folder-status blocked';
                            const statusText = src.authorized ? '已授权' : '未授权';
                            html += `<div class="folder-row">
                                <span class="folder-name">${FOLDER_ICON}<span>${safeF}</span></span>
                                <span class="folder-actions">
                                    <span class="${statusCls}">${statusText}</span>
                                    <button type="button" class="folder-remove" data-path="${attrF}">移除</button>
                                </span>
                            </div>`;
                        }
                    }
                    if (src.type === 'imported_copy') {
                        html += `<div class="folder-row">
                            <span class="folder-name">${PACKAGE_ICON}<span>导入副本存储</span></span>
                            <span class="folder-actions"><span class="folder-status ok">已启用</span></span>
                        </div>`;
                    }
                }
                if (!html) {
                    html = '<div class="admin-muted">暂未配置本地文件夹。桌面客户端可通过系统托盘选择，或点击上方"添加文件夹"。</div>';
                }
                folderList.innerHTML = html;

                // 照片总数
                if (galleryCount) {
                    galleryCount.textContent = `${data.photo_count} 张照片`;
                }
            } catch (e) {
                folderList.innerHTML = '<div class="admin-error">加载失败</div>';
            }
        }

        // 事件委托：移除按钮（P0-1）
        folderList.addEventListener('click', (e) => {
            const btn = e.target.closest('.folder-remove');
            if (!btn) return;
            const path = btn.dataset.path;
            if (path && typeof window.removeFolder === 'function') {
                window.removeFolder(path);
            }
        });

        window.addFolder = async function() {
            const folder = prompt('请输入文件夹的绝对路径：\n例如: /Users/jackdu/Photos');
            if (!folder || !folder.trim()) return;

            try {
                const res = await fetch('/api/photo-sources/folders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folder: folder.trim() }),
                });
                const data = await res.json();
                if (res.ok) {
                    loadSources();
                } else {
                    alert(data.error || '添加失败');
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            }
        };

        window.removeFolder = async function(folderPath) {
            if (!confirm(`确定移除文件夹？\n${folderPath}\n\n仅从电子相册中移除引用，不会删除原文件。`)) return;

            try {
                const res = await fetch('/api/photo-sources/folders', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folder: folderPath }),
                });
                const data = await res.json();
                if (res.ok) {
                    loadSources();
                } else {
                    alert(data.error || '移除失败');
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            }
        };

        window.rescanSources = async function() {
            const btn = document.getElementById('rescan-btn');
            btn.disabled = true;
            btn.textContent = '扫描中...';
            scanStatus.style.display = 'block';
            scanStatus.textContent = '正在扫描文件夹...';

            try {
                const res = await fetch('/api/photo-sources/rescan', { method: 'POST' });
                const data = await res.json();
                scanStatus.textContent = `扫描完成：共 ${data.total} 张照片`;
                if (data.missing_marked > 0) {
                    scanStatus.textContent += `，标记 ${data.missing_marked} 张缺失`;
                }
                loadSources();
            } catch (e) {
                scanStatus.textContent = '扫描失败: ' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '重新扫描';
            }
        };

        // 页面加载时获取源状态
        if (folderList) loadSources();
    })();
    </script>
</body>

</html>
