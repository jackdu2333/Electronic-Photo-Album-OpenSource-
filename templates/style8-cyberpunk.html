<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>数字相册 - 样式 8：赛博朋克</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            font-family: 'Orbitron', monospace;
            background: #0A0E27;
            overflow: hidden;
            position: relative;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            color-scheme: dark;
            padding-right: env(safe-area-inset-right);
        }

        /* 网格背景 - 优化动画频率 */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridPulse 6s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* 扫描线动画 - 优化为 6 秒循环 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 240, 255, 0.6), 
                rgba(255, 46, 147, 0.6), 
                transparent);
            animation: scanDown 6s linear infinite;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            will-change: transform;
            mix-blend-mode: screen;
        }

        @keyframes scanDown {
            0% { transform: translateY(-5vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* 斜角照片框 - 优化尺寸 */
        .photo-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            height: 60%;
            border-radius: 8px;
            border: 3px solid #00F0FF;
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.6),
                inset 0 0 40px rgba(0, 240, 255, 0.3);
            overflow: hidden;
            /* 照片加载失败兜底 */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.2) contrast(1.1);
            transition: filter 0.35s ease;
        }

        .photo-meta-chip,
        .memory-salvage-chip {
            position: absolute;
            z-index: 4;
            padding: 10px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.08em;
        }

        .photo-meta-chip {
            left: 20px;
            bottom: 20px;
            background: rgba(5, 12, 32, 0.72);
            border: 1px solid rgba(0, 240, 255, 0.38);
            color: #C3FCFF;
            font-size: 12px;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.18);
        }

        .memory-salvage-chip {
            top: 18px;
            right: 18px;
            background: rgba(33, 8, 25, 0.8);
            border: 1px solid rgba(255, 46, 147, 0.4);
            color: #FFD4E9;
            font-size: 11px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(255, 46, 147, 0.24);
        }

        body.has-salvaged-photo .photo-frame {
            box-shadow:
                0 0 34px rgba(0, 240, 255, 0.58),
                0 0 48px rgba(255, 46, 147, 0.18),
                inset 0 0 40px rgba(255, 46, 147, 0.12);
        }

        body.has-salvaged-photo .photo-frame img {
            filter: saturate(1.02) contrast(1.08) brightness(0.94);
        }

        /* 时间 - 霓虹粉 */
        .time {
            position: absolute;
            top: 5%;
            left: 50px;
            font-size: clamp(64px, 4.2vw, 124px);
            font-weight: 900;
            color: #FF2E93;
            text-shadow: 
                0 0 15px rgba(255, 46, 147, 0.9),
                0 0 30px rgba(255, 46, 147, 0.6),
                0 0 45px rgba(255, 46, 147, 0.4);
            letter-spacing: 6px;
        }

        /* 日期 - 霓虹青 */
        .date {
            position: absolute;
            top: calc(5% + clamp(64px, 4.2vw, 124px) + 8px);
            left: 50px;
            font-size: clamp(16px, 1.2vw, 28px);
            color: #00F0FF;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            letter-spacing: 4px;
        }

        /* 天气 - 霓虹黄 */
        .weather {
            position: absolute;
            top: 5%;
            right: 50px;
            font-size: clamp(24px, 1.6vw, 42px);
            color: #FFE600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* HUD 四角装饰 */
        .hud-corner {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid #00F0FF;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .hud-tl {
            top: 200px;
            left: 50px;
            border-right: none;
            border-bottom: none;
        }

        .hud-tr {
            top: 200px;
            right: 50px;
            border-left: none;
            border-bottom: none;
        }

        .hud-bl {
            bottom: 50px;
            left: 50px;
            border-right: none;
            border-top: none;
        }

        .hud-br {
            bottom: 50px;
            right: 50px;
            border-left: none;
            border-top: none;
        }

        /* 每日一言面板（底部中间） */
        .daily-quote-panel {
            position: absolute;
            left: 50%;
            bottom: 34px;
            transform: translateX(-50%);
            width: clamp(560px, 52vw, 980px);
            min-height: 102px;
            background: rgba(10, 14, 39, 0.85);
            border: 2px solid rgba(255, 46, 147, 0.4);
            border-radius: 14px;
            padding: 14px 22px 12px;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 30px rgba(255, 46, 147, 0.3),
                inset 0 0 20px rgba(255, 46, 147, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .daily-quote-label {
            color: rgba(0, 240, 255, 0.9);
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
        }

        .daily-quote-text {
            width: 100%;
            color: #FFE8F7;
            font-size: clamp(18px, 1.45vw, 28px);
            line-height: 1.32;
            text-align: center;
            text-shadow: 0 0 12px rgba(255, 46, 147, 0.42);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .daily-quote-source {
            width: 100%;
            color: rgba(0, 240, 255, 0.82);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .time {
                font-size: clamp(36px, 6vw, 72px);
            }
            .date {
                font-size: clamp(12px, 1.2vw, 20px);
            }
            .photo-frame {
                height: 70%;
                width: 40%;
            }
            .daily-quote-panel {
                display: none;
            }
        }

        @media (max-width: 600px) {
            body {
                overflow-x: hidden;
            }

            .time {
                top: 5%;
                left: 16px;
                font-size: clamp(54px, 18vw, 78px);
                letter-spacing: 2px;
            }

            .date {
                top: calc(5% + clamp(54px, 18vw, 78px) + 6px);
                left: 20px;
                font-size: 14px;
                letter-spacing: 3px;
            }

            .weather {
                top: 5%;
                right: 18px;
                gap: 6px;
                font-size: 20px;
            }

            .photo-frame {
                top: 47%;
                width: min(62vw, 260px);
                height: min(60vh, 506px);
                min-height: min(60vh, 420px);
                border-width: 2px;
            }

            .photo-meta-chip,
            .memory-salvage-chip {
                padding: 8px 12px;
                font-size: 11px;
            }

            .hud-corner {
                width: 42px;
                height: 54px;
                border-width: 2px;
            }

            .hud-tl,
            .hud-tr {
                top: 200px;
            }

            .hud-tl,
            .hud-bl {
                left: 50px;
            }

            .hud-tr,
            .hud-br {
                right: 50px;
            }

            .daily-quote-panel {
                left: 14px;
                right: 14px;
                bottom: 34px;
                transform: none;
                width: auto;
                min-height: 92px;
                padding: 12px 14px 10px;
            }

            .daily-quote-text {
                font-size: 16px;
                white-space: normal;
                overflow-wrap: anywhere;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }

            .daily-quote-source {
                max-width: 100%;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="quick-theme-nav" style="position: fixed; top: 12px; right: 12px; z-index: 99999; display: none; gap: 6px; flex-wrap: wrap; padding: 8px 10px; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font: 12px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
        <a href="/" style="color: #fff; text-decoration: none; padding: 4px 8px; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px;">首页</a>
        <a href="/?theme=style7" style="color: #fff; text-decoration: none; padding: 4px 8px;">7</a>
        <a href="/?theme=style8" style="color: #fff; text-decoration: none; padding: 4px 8px;">8</a>
        <a href="/?theme=style9" style="color: #fff; text-decoration: none; padding: 4px 8px;">9</a>
        <a href="/?theme=style10" style="color: #fff; text-decoration: none; padding: 4px 8px;">10</a>
        <a href="/?theme=style11" style="color: #fff; text-decoration: none; padding: 4px 8px;">11</a>
        <a href="/?theme=style12" style="color: #fff; text-decoration: none; padding: 4px 8px;">12</a>
        <a href="/?theme=style13" style="color: #fff; text-decoration: none; padding: 4px 8px;">13</a>
        <a href="/?theme=style14" style="color: #fff; text-decoration: none; padding: 4px 8px;">14</a>
        <a href="/?theme=style15" style="color: #fff; text-decoration: none; padding: 4px 8px;">15</a>
        <a href="/?theme=style16" style="color: #fff; text-decoration: none; padding: 4px 8px;">16</a>
    </div>
    <!-- 网格背景 -->
    <div class="grid-bg"></div>

    <!-- 扫描线 -->
    <div class="scan-line"></div>

    <!-- 斜角照片框 -->
    <div class="photo-frame">
        <img id="main-photo" alt="照片" loading="eager">
        <div class="photo-meta-chip" data-photo-date-target>拍摄日期未记录</div>
        <div class="memory-salvage-chip" data-salvage-target hidden>Memory Salvaged</div>
    </div>

    <!-- 时间 -->
    <div class="time" id="current-time">--:--</div>

    <!-- 日期 -->
    <div class="date" id="current-date">----</div>

    <!-- 天气 -->
    <div class="weather">
        <span>🌤️</span>
        <span id="weather-temp">--°C</span>
    </div>

    <!-- HUD 四角装饰 -->
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>

    <!-- 每日一言 -->
    <div class="daily-quote-panel">
        <div class="daily-quote-label">DAILY QUOTE</div>
        <div class="daily-quote-text" id="daily-quote-text">正在连接每日一言...</div>
        <div class="daily-quote-source" id="daily-quote-source">来源：系统</div>
    </div>
    <script>
        const PHOTO_REFRESH_MS = 5 * 60 * 1000;
        const WEATHER_REFRESH_MS = 30 * 60 * 1000;
        const QUOTE_REFRESH_MS = 6 * 60 * 60 * 1000;

        function clipText(input, maxLen) {
            const text = String(input || '').trim();
            if (!text) return '';
            return text.length > maxLen ? `${text.slice(0, maxLen)}…` : text;
        }

        function photoStaticUrl(filename) {
            return '/static/photos/' + String(filename || '')
                .split('/')
                .map(part => encodeURIComponent(part))
                .join('/');
        }

        function getPhotoDisplayUrl(photo) {
            if (photo && photo.display_url) return photo.display_url;
            return photoStaticUrl(photo ? photo.url : '');
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent =
                `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('current-date').textContent =
                `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        async function fetchMainPhoto() {
            try {
                const response = await fetch('/api/get_photo', { credentials: 'same-origin' });
                if (!response.ok) return;
                const photo = await response.json();
                if (!photo || !photo.url) return;

                const img = document.getElementById('main-photo');
                img.onerror = null;
                img.src = getPhotoDisplayUrl(photo);
                img.alt = photo.url;
                if (typeof window.__applyUnifiedPhotoMeta === 'function') {
                    window.__applyUnifiedPhotoMeta(photo);
                }
                img.onerror = () => {
                    setTimeout(fetchMainPhoto, 1200);
                };
            } catch (_) {}
        }

        async function fetchWeather() {
            try {
                const response = await fetch('/api/weather-config', { credentials: 'same-origin' });
                if (!response.ok) return;
                const data = await response.json();
                if (data && data.enabled && data.current && Number.isFinite(data.current.temperature_2m)) {
                    document.getElementById('weather-temp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
                }
            } catch (_) {}
        }

        async function fetchDailyQuote() {
            try {
                const response = await fetch('/api/daily-quote', { credentials: 'same-origin' });
                if (!response.ok) return;
                const data = await response.json();
                if (!data || !data.text) return;

                const quoteText = document.getElementById('daily-quote-text');
                const quoteSource = document.getElementById('daily-quote-source');

                if (quoteText) {
                    quoteText.textContent = clipText(data.text, 46);
                }
                if (quoteSource) {
                    const source = clipText(data.source || data.provider || '每日一言', 22);
                    quoteSource.textContent = `来源：${source}`;
                }
            } catch (_) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            fetchMainPhoto();
            fetchWeather();
            fetchDailyQuote();
            setInterval(fetchMainPhoto, PHOTO_REFRESH_MS);
            setInterval(fetchWeather, WEATHER_REFRESH_MS);
            setInterval(fetchDailyQuote, QUOTE_REFRESH_MS);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    fetchMainPhoto();
                    fetchWeather();
                    fetchDailyQuote();
                }
            });
        });
    </script>
    <script src="{{ url_for('static', filename='unified-style-menu.js') }}?v=2"></script>
</body>
</html>
