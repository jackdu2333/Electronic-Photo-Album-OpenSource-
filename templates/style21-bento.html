<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>生活便当 - Bento</title>
    <style>
        /* ============================================================
           style21 · 生活便当 Bento
           设计哲学：照片是主菜，时钟、天气、回忆数、留言是配菜——
           浅灰托盘 + 白磁贴 + 系统字体零装饰，让网格与数字本身成为界面。
           右上角预留统一菜单开关位（页头横条右侧永不放内容）。
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f5f7;
            --tile: #ffffff;
            --ink: #1d1d1f;
            --ink-2: #6e6e73;
            --accent: #007AFF;
            --tile-border: rgba(0, 0, 0, 0.04);
            --tile-shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
            --radius: 18px;
            --gap: 12px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            display: flex;
            flex-direction: column;
        }

        /* ---------- 页头：右侧整条留给统一菜单 ---------- */
        .bento-header {
            display: flex;
            align-items: center;
            height: 52px;
            padding: 0 22px;
            flex-shrink: 0;
        }

        .wordmark {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--ink);
        }

        .wordmark i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 3px;
            background: var(--accent);
            margin-right: 8px;
        }

        .wordmark small {
            font-weight: 400;
            color: var(--ink-2);
            margin-left: 8px;
            letter-spacing: 0.14em;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* ---------- 便当网格 ---------- */
        .bento-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 2.2fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: var(--gap);
            padding: 0 20px 20px;
        }

        .tile {
            background: var(--tile);
            border: 1px solid var(--tile-border);
            border-radius: var(--radius);
            box-shadow: var(--tile-shadow);
            padding: 18px;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .tile-label {
            font-size: 12px;
            letter-spacing: 0.1em;
            color: var(--ink-2);
            margin-bottom: 10px;
        }

        /* 照片主磁贴 */
        .tile-photo {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
            padding: 0;
            position: relative;
            cursor: pointer;
            justify-content: flex-end;
        }

        .tile-photo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.6s ease;
        }

        .tile-photo img.loaded {
            opacity: 1;
        }

        .tile-photo:hover img.loaded {
            transform: scale(1.02);
        }

        .tile-photo.photo-load-error::after {
            content: "照片加载失败";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
            font-size: 13px;
            background: repeating-linear-gradient(45deg, #f5f5f7, #f5f5f7 8px, #ececec 8px, #ececec 16px);
        }

        .photo-date-pill {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 2;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--ink);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
        }

        /* 时钟磁贴 */
        .tile-clock .time {
            font-size: clamp(30px, 3.4vw, 44px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        .tile-clock .date {
            margin-top: 8px;
            font-size: 13px;
            color: var(--ink-2);
        }

        /* 天气磁贴 */
        .tile-weather .weather-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tile-weather .weather-row span {
            font-size: clamp(26px, 2.6vw, 36px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .tile-weather #weather-icon {
            font-size: 24px;
            line-height: 1;
        }

        .tile-weather #weather-desc {
            margin-top: 8px;
            font-size: 13px;
            color: var(--ink-2);
        }

        /* 回忆数磁贴 */
        .tile-stats .stat {
            font-size: clamp(30px, 3.4vw, 44px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1.05;
        }

        .tile-stats .stat small {
            font-size: 14px;
            font-weight: 500;
            margin-left: 4px;
            color: var(--ink);
        }

        .tile-stats .sub {
            margin-top: 8px;
            font-size: 13px;
            color: var(--ink-2);
        }

        /* 留言磁贴 */
        .tile-memo .memo-content {
            font-size: 14px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tile-memo .memo-content:empty::after {
            content: "还没有留言，去说一句吧";
            color: var(--ink-2);
        }

        .tile-memo .memo-sender {
            margin-top: 8px;
            font-size: 12px;
            color: var(--ink-2);
        }

        .tile-memo .memo-sender:empty {
            display: none;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 900px) {
            body {
                overflow-y: auto;
            }

            .bento-header {
                height: 48px;
                padding: 0 16px;
            }

            .bento-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 46vh auto;
                padding: 0 14px 18px;
            }

            .tile-photo {
                grid-column: 1 / 3;
                grid-row: 1;
                min-height: 0;
            }

            .tile-clock { grid-column: 1; grid-row: 2; min-height: 108px; }
            .tile-weather { grid-column: 2; grid-row: 2; min-height: 108px; }
            .tile-stats { grid-column: 1; grid-row: 3; min-height: 108px; }
            .tile-memo { grid-column: 2; grid-row: 3; min-height: 108px; }
        }

        /* ---------- 无障碍基线：键盘焦点 + 动效减弱 ---------- */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <header class="bento-header">
        <span class="wordmark"><i aria-hidden="true"></i>生活便当<small>BENTO</small></span>
        <!-- 页头右侧整条留空：统一菜单开关（top:14px right:14px）落在这里 -->
    </header>

    <main class="bento-grid">
        <!-- 照片主磁贴：点击换下一张 -->
        <section class="tile tile-photo" id="photo-tile" aria-label="家庭照片，点击切换下一张">
            <img id="main-img" alt="家庭照片">
            <span class="photo-date-pill" id="photo-date">—</span>
        </section>

        <!-- 时钟 -->
        <section class="tile tile-clock" aria-label="当前时间">
            <div class="time" id="clock-time">--:--</div>
            <div class="date" id="clock-date">—</div>
        </section>

        <!-- 天气（weather-widget.js 自动填充） -->
        <section class="tile tile-weather" aria-label="当前天气">
            <div class="tile-label">天气</div>
            <div class="weather-row">
                <span id="weather-temp">--°C</span>
                <span id="weather-icon" aria-hidden="true">🌤️</span>
            </div>
            <div id="weather-desc">天气已关闭</div>
        </section>

        <!-- 回忆数 -->
        <section class="tile tile-stats" aria-label="相册照片总数">
            <div class="tile-label">回忆</div>
            <div class="stat"><span id="stat-count">0</span><small>张</small></div>
            <div class="sub">相册全部照片</div>
        </section>

        <!-- 留言 -->
        <section class="tile tile-memo" aria-label="最新留言">
            <div class="tile-label">最新留言</div>
            <div class="memo-content" id="memo-content"></div>
            <div class="memo-sender" id="memo-sender"></div>
        </section>
    </main>

    <script src="/static/weather-widget.js"></script>
    <script src="/static/unified-style-menu.js"></script>
    <script>
        (function () {
            'use strict';

            const mainImg = document.getElementById('main-img');
            const photoTile = document.getElementById('photo-tile');
            const photoDateEl = document.getElementById('photo-date');
            const memoContent = document.getElementById('memo-content');
            const memoSender = document.getElementById('memo-sender');

            let photos = [];
            let currentIndex = 0;
            let photoFailStreak = 0; // 连续加载失败熔断

            function pad(n) { return String(n).padStart(2, '0'); }
            function clip(text, n) {
                text = String(text || '');
                return text.length > n ? text.slice(0, n) + '…' : text;
            }

            /* ---------- 时钟与日期 ---------- */
            const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            function tickClock() {
                const now = new Date();
                document.getElementById('clock-time').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
                document.getElementById('clock-date').textContent =
                    (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + WEEKDAYS[now.getDay()];
            }

            /* ---------- 照片日期戳 ---------- */
            function formatPhotoDate(dateStr) {
                const m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(dateStr || ''));
                if (!m) return '';
                return m[1] + '.' + pad(Number(m[2])) + '.' + pad(Number(m[3]));
            }

            /* ---------- 照片轮播（交叉淡入，便当式温柔换片） ---------- */
            function showPhoto(index) {
                if (!photos.length) return;
                currentIndex = (index + photos.length) % photos.length;
                const p = photos[currentIndex];
                const url = p.display_url || '/api/photos/' + p.id + '/image';
                mainImg.onload = function () { photoFailStreak = 0; };
                mainImg.onerror = function () {
                    mainImg.onerror = null;
                    photoFailStreak += 1;
                    photoTile.classList.add('photo-load-error');
                    if (photoFailStreak < photos.length) showPhoto(currentIndex + 1);
                };
                mainImg.classList.remove('loaded');
                mainImg.src = url;
                mainImg.addEventListener('load', function onLoaded() {
                    mainImg.removeEventListener('load', onLoaded);
                    photoTile.classList.remove('photo-load-error');
                    mainImg.classList.add('loaded');
                });
                const d = formatPhotoDate(p.date);
                photoDateEl.textContent = d;
                photoDateEl.style.display = d ? '' : 'none';
            }

            function nextImage() { showPhoto(currentIndex + 1); }
            function prevImage() { showPhoto(currentIndex - 1); }
            window.nextImage = nextImage;
            window.prevImage = prevImage;

            async function fetchPhotos() {
                try {
                    const res = await fetch('/api/photos', { credentials: 'same-origin' });
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        photos = data;
                        document.getElementById('stat-count').textContent = photos.length;
                        showPhoto(0);
                        setInterval(() => showPhoto(currentIndex + 1), 8000);
                    }
                } catch (e) { console.error(e); }
            }

            /* ---------- 最新留言（含留言人） ---------- */
            async function fetchLatestMessage() {
                try {
                    const res = await fetch('/api/messages?limit=10', { credentials: 'same-origin' });
                    if (!res.ok) return;
                    const list = await res.json();
                    if (!Array.isArray(list) || list.length === 0) return;
                    const latest = list[list.length - 1];
                    if (!latest || !latest.content) return;
                    memoContent.textContent = clip(latest.content, 60);
                    memoSender.textContent = latest.sender ? '—— ' + clip(latest.sender, 12) : '';
                } catch (_) { /* 静默 */ }
            }

            /* ---------- 启动 ---------- */
            document.addEventListener('DOMContentLoaded', function () {
                tickClock();
                setInterval(tickClock, 1000);
                fetchPhotos();
                fetchLatestMessage();
                setInterval(fetchLatestMessage, 60000);
                photoTile.addEventListener('click', nextImage);
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        tickClock();
                        fetchLatestMessage();
                    }
                });
            });
        })();
    </script>
</body>

</html>
