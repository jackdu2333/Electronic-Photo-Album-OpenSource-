services:
  photoframe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-photo-frame
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      # 照片数据持久化
      - ./data/photos:/app/static/photos
      # 数据库持久化
      - ./data/db:/app/data
      # 日志持久化
      - ./logs:/app/logs
    environment:
      # 必需配置（不设默认值，缺少时容器启动失败）
      - SECRET_KEY=${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      # 必需配置（不设默认值，缺少 ADMIN_USERS 时容器启动失败）
      - ADMIN_USERS=${ADMIN_USERS:?请在 .env 中设置 ADMIN_USERS，例如 admin:ChangeMe123!}
      # 可选配置
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - DATABASE_FILE=/app/data/photos.db
      - METADATA_FILE=/app/data/photo_metadata.json
      - MESSAGES_FILE=/app/data/messages.json
      - BABY_NAME=${BABY_NAME:-}
      - BABY_BIRTHDAY=${BABY_BIRTHDAY:-}
      - WEATHER_LAT=${WEATHER_LAT:-31.3041}
      - WEATHER_LON=${WEATHER_LON:-120.5954}
      - WEATHER_ENABLED=${WEATHER_ENABLED:-true}
      - TAG_WEIGHTS=${TAG_WEIGHTS:-宝宝：1.8，露营：1.5，旅行：1.3}
      - SLIDE_DURATION_SECONDS=${SLIDE_DURATION_SECONDS:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photoframe-net

networks:
  photoframe-net:
    driver: bridge
